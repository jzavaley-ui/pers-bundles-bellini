<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellini · Chair bundle add-on prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #FAFAFA; }
  iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
</style>
</head>
<body>
<iframe id="view" title="Bundle builder prototype"></iframe>
<script>
  // Phones and small tablets get the bottom-sheet drawer; wider screens get the popup.
  var BREAKPOINT = 768;
  var frame = document.getElementById('view');
  var current = null;
  function pick() {
    var next = window.innerWidth < BREAKPOINT ? 'mobile.html' : 'desktop.html';
    if (next !== current) {
      current = next;
      frame.src = next;
    }
  }
  pick();
  window.addEventListener('resize', pick);
</script>
</body>
</html>
